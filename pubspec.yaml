name: project_bugbite
description: "BiteWise is a visual, suggestion-first insect bite education app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  image: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/contexts/
    - assets/images/bites/
    - assets/images/guides/
